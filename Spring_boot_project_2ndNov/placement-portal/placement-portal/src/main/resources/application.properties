spring.application.name=placement-portal
spring.main.banner-mode=off

# ---- MySQL connection (override with environment variables DB_URL / DB_USERNAME / DB_PASSWORD) ----
# createDatabaseIfNotExist=true -> the 'placement_portal' schema is created automatically on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/placement_portal
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
logging.level.root=WARN
logging.level.com.university.placement=INFO


# ===================================
# JPA / Hibernate Configuration
# ===================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



# ===================================
# Error Configuration
# ===================================
spring.web.error.include-message=always